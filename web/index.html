<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Square Lights</title>
<style>
  :root { --bg: #000; --fg: #ffd978; --dim: #9a8a63; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.4 system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 16px; pointer-events: none; }
  #overlay.click { pointer-events: auto; cursor: pointer; }
  #overlay[hidden] { display: none; }
  #overlay h1 { font-weight: 600; letter-spacing: .3em; margin: 0 0 .5em; }
  #overlay p { color: var(--dim); margin: .25em 0; }
  #debug { position: fixed; left: 8px; top: 8px; font: 11px/1.35 ui-monospace, monospace; color: #8f8;
    background: #000a; padding: 6px 8px; white-space: pre; pointer-events: none; max-width: calc(100vw - 32px); }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="overlay"><div><h1>SQUARE LIGHTS</h1><p id="status">loading…</p></div></div>
<div id="debug" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
